<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Number Quest</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Thai",sans-serif;background:#191232;color:#fff;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#38295a 1.5px,transparent 1.5px);background-size:36px 42px;opacity:.7}
.wrap{position:relative;z-index:1;max-width:520px;margin:auto;min-height:100vh;padding:22px 18px;display:flex;flex-direction:column;justify-content:center}
.card{background:linear-gradient(160deg,#30234f,#21183b);border:1px solid #59447d;border-radius:26px;padding:24px 18px;box-shadow:0 16px 40px #09051188}
h1{color:#50e1ff;text-align:center;font-size:clamp(24px,7vw,38px);margin:0 0 6px;text-shadow:0 0 18px #50e1ff44}
.brand{text-align:center;color:#ff65c3;font-weight:900;letter-spacing:3px;margin-bottom:12px}
.sub{text-align:center;color:#d7c9f7;margin:0 0 20px}
.stats{display:flex;justify-content:space-around;gap:8px;margin:12px 0 18px}
.stat{background:#3b2c65;border-radius:14px;padding:10px 12px;text-align:center;flex:1;font-size:14px}
.stat strong{display:block;color:#50e1ff;font-size:20px}
.btn{border:2px solid #fff;color:#fff;border-radius:16px;padding:14px 10px;font-size:18px;font-weight:700;width:100%;margin:8px 0;cursor:pointer;background:#ff41b3}
.btn:active,.key:active{transform:scale(.98)}
.purple{background:#8c5aff}.green{background:#32d282}.red{background:#ff4b64}.dark{background:#48376f}
.hidden{display:none!important}
.display{background:#48376f;border-radius:18px;text-align:center;padding:18px;font-size:32px;color:#50e1ff;margin:12px 0}
.message{text-align:center;min-height:34px;margin:10px 0;font-weight:700;color:#50e1ff}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{background:#48376f;border:2px solid #50e1ff;color:#fff;border-radius:13px;padding:14px 5px;font-size:22px;font-weight:700;cursor:pointer}
.key.guess{background:#ff41b3}
.row{display:flex;gap:10px}.row .btn{flex:1}
.heart{color:#ff65c3}.hint{color:#ffdc41}
footer{text-align:center;color:#bbaedb;font-size:12px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap"><main class="card">
<section id="home">
<h1>เกมทายเลขปริศนา</h1><div class="brand">NUMBER QUEST</div>
<p class="sub">มาทายเลขลับกันเถอะ</p>
<div class="stats"><div class="stat">คะแนนสูงสุด<strong id="bestHome">0</strong></div></div>
<button class="btn" onclick="show('levels')">เริ่มเกม</button>
<p class="sub">เดาเลขให้ถูก ลุ้นคะแนน และรักษาหัวใจไว้!</p>
</section>
<section id="levels" class="hidden">
<h1>เลือกระดับความยาก</h1><p class="sub">เลือกความท้าทายของคุณ</p>
<button class="btn green" onclick="start('ง่าย',20,1,3)">ง่าย (1 ถึง 20)</button>
<button class="btn purple" onclick="start('ปานกลาง',50,2,4)">ปานกลาง (1 ถึง 50)</button>
<button class="btn red" onclick="start('ยาก',100,3,6)">ยาก (1 ถึง 100)</button>
<button class="btn dark" onclick="show('home')">กลับหน้าหลัก</button>
</section>
<section id="game" class="hidden">
<h1>NUMBER QUEST</h1>
<div class="stats"><div class="stat">คะแนน<strong id="score">0</strong></div><div class="stat">สูงสุด<strong id="bestGame">0</strong></div></div>
<div class="stat">ระดับ <strong id="level">ง่าย</strong></div>
<div class="stat heart" id="hearts">หัวใจ 3 / 3</div>
<div class="display" id="number">??</div>
<div class="message" id="msg">ลองทายตัวเลขดูสิ!</div>
<div class="keypad" id="keypad"></div>
<button class="btn dark" onclick="show('home')">กลับหน้าหลัก</button>
</section>
<section id="result" class="hidden">
<h1>สรุปผลเกม</h1><div class="brand">NUMBER QUEST</div>
<div class="message" id="resultMsg"></div>
<div class="stats"><div class="stat">คะแนน<strong id="resultScore">0</strong></div><div class="stat">สูงสุด<strong id="resultBest">0</strong></div></div>
<button class="btn" onclick="show('levels')">เล่นอีกครั้ง</button><button class="btn purple" onclick="show('home')">กลับหน้าหลัก</button>
</section>
</main><footer>NUMBER QUEST · เกมทายเลขปริศนา</footer></div>
<script>
let score=0, best=Number(localStorage.getItem("nq_best")||0), level="ง่าย", maximum=20, multiplier=1, secret=0, hearts=3, maxHearts=3, input="";
const $=id=>document.getElementById(id);
function show(page){["home","levels","game","result"].forEach(p=>$(p).classList.toggle("hidden",p!==page));$("bestHome").textContent=best}
function start(l,m,x,h){level=l;maximum=m;multiplier=x;maxHearts=h;hearts=h;secret=Math.floor(Math.random()*maximum)+1;input="";$("level").textContent=level;$("score").textContent=score;$("bestGame").textContent=best;update();$("msg").textContent="ลองทายตัวเลขดูสิ!";show("game")}
function update(){$("number").textContent=input||"??";$("hearts").textContent=`หัวใจ ${hearts} / ${maxHearts}`;$("score").textContent=score;$("bestGame").textContent=best}
function key(k){if(k==="ลบ"){input=input.slice(0,-1)}else if(k==="ทาย"){guess();return}else if(input.length<3){input+=k}update()}
function guess(){if(!input){$("msg").textContent="กรุณาใส่ตัวเลขก่อน";return}let n=Number(input);if(n<1||n>maximum){$("msg").textContent="ตัวเลขอยู่นอกช่วง";input="";update();return}if(n===secret){score+=(hearts*10+10)*multiplier;$("resultMsg").textContent="ยินดีด้วย คุณทายถูก!";finish()}else{hearts--; $("msg").textContent=n<secret?"น้อยไป ลองเพิ่มอีก":"มากไป ลองลดอีก";input="";update();if(hearts<=0){$("resultMsg").textContent=`หมดหัวใจ เลขคือ ${secret}`;finish()}}}
function finish(){if(score>best){best=score;localStorage.setItem("nq_best",best)}$("resultScore").textContent=score;$("resultBest").textContent=best;show("result")}
const keys=["1","2","3","4","5","6","7","8","9","ลบ","0","ทาย"];
keys.forEach(k=>{let b=document.createElement("button");b.className="key"+(k==="ทาย"?" guess":"");b.textContent=k;b.onclick=()=>key(k);$("keypad").appendChild(b)});
show("home");
</script></body></html>
